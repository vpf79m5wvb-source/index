<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CardSwipe" />
  <title>CardSwipe MTG</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">MTG discovery</div>
        <h1>CardSwipe</h1>
      </div>
      <button id="filtersBtn" class="icon-button" aria-label="Open filters">☰</button>
    </header>

    <main>
      <section id="discoverView" class="view active" aria-labelledby="discoverTab">
        <div class="stats-row">
          <span><strong id="savedCount">0</strong> saved</span>
          <span><strong id="seenCount">0</strong> reviewed</span>
        </div>

        <div id="cardStage" class="card-stage" aria-live="polite">
          <div id="loadingState" class="state-panel">
            <div class="spinner"></div>
            <p>Loading cards…</p>
          </div>
        </div>

        <div class="action-row">
          <button id="undoBtn" class="round-action small" aria-label="Undo last swipe" disabled>↶</button>
          <button id="skipBtn" class="round-action skip" aria-label="Skip card">✕</button>
          <button id="saveBtn" class="round-action save" aria-label="Save card">♥</button>
          <button id="detailsBtn" class="round-action small" aria-label="Show card details">i</button>
        </div>
        <p class="gesture-hint">Swipe left to skip · Swipe right to save</p>
      </section>

      <section id="savedView" class="view" aria-labelledby="savedTab">
        <div class="section-heading">
          <div>
            <div class="eyebrow">Your picks</div>
            <h2>Saved cards</h2>
          </div>
          <button id="exportBtn" class="text-button">Export</button>
        </div>
        <div id="savedGrid" class="saved-grid"></div>
        <div id="savedEmpty" class="empty-state">
          <div class="empty-icon">♡</div>
          <h3>No saved cards yet</h3>
          <p>Swipe right on cards you want to keep.</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button id="discoverTab" class="nav-item active" data-view="discoverView">
        <span class="nav-icon">◈</span><span>Discover</span>
      </button>
      <button id="savedTab" class="nav-item" data-view="savedView">
        <span class="nav-icon">♡</span><span>Saved</span>
      </button>
    </nav>
  </div>

  <div id="filterSheet" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="filtersTitle">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div><div class="eyebrow">Discovery rules</div><h2 id="filtersTitle">Filters</h2></div>
        <button id="closeFiltersBtn" class="icon-button">✕</button>
      </div>

      <label class="field-label" for="formatFilter">Format legality</label>
      <select id="formatFilter" class="field-input">
        <option value="">Any format</option>
        <option value="commander">Commander</option>
        <option value="standard">Standard</option>
        <option value="modern">Modern</option>
        <option value="pioneer">Pioneer</option>
        <option value="pauper">Pauper</option>
      </select>

      <fieldset>
        <legend>Colors</legend>
        <div class="color-pills">
          <label><input type="checkbox" value="W" class="colorCheck"><span>W</span></label>
          <label><input type="checkbox" value="U" class="colorCheck"><span>U</span></label>
          <label><input type="checkbox" value="B" class="colorCheck"><span>B</span></label>
          <label><input type="checkbox" value="R" class="colorCheck"><span>R</span></label>
          <label><input type="checkbox" value="G" class="colorCheck"><span>G</span></label>
          <label><input type="checkbox" value="C" class="colorCheck"><span>C</span></label>
        </div>
        <label class="check-row"><input id="exactColors" type="checkbox"> Match only selected colors</label>
      </fieldset>

      <label class="field-label" for="typeFilter">Card type</label>
      <select id="typeFilter" class="field-input">
        <option value="">Any type</option>
        <option value="creature">Creature</option>
        <option value="instant">Instant</option>
        <option value="sorcery">Sorcery</option>
        <option value="artifact">Artifact</option>
        <option value="enchantment">Enchantment</option>
        <option value="planeswalker">Planeswalker</option>
        <option value="land">Land</option>
      </select>

      <label class="field-label" for="rarityFilter">Rarity</label>
      <select id="rarityFilter" class="field-input">
        <option value="">Any rarity</option>
        <option value="common">Common</option>
        <option value="uncommon">Uncommon</option>
        <option value="rare">Rare</option>
        <option value="mythic">Mythic</option>
      </select>

      <div class="two-col">
        <div>
          <label class="field-label" for="manaMax">Max mana value</label>
          <input id="manaMax" class="field-input" type="number" min="0" max="20" placeholder="Any" />
        </div>
        <div>
          <label class="field-label" for="priceMax">Max USD price</label>
          <input id="priceMax" class="field-input" type="number" min="0" step="0.01" placeholder="Any" />
        </div>
      </div>

      <label class="check-row"><input id="excludeDigital" type="checkbox" checked> Paper cards only</label>

      <div class="sheet-actions">
        <button id="resetFiltersBtn" class="secondary-button">Reset</button>
        <button id="applyFiltersBtn" class="primary-button">Apply filters</button>
      </div>
    </div>
  </div>

  <div id="detailsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="detailsName">
    <div class="details-modal">
      <button id="closeDetailsBtn" class="modal-close">✕</button>
      <img id="detailsImage" alt="" />
      <div class="details-copy">
        <h2 id="detailsName"></h2>
        <p id="detailsMeta" class="muted"></p>
        <p id="detailsText"></p>
        <div id="detailsPrice" class="price-pill"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js" defer></script>
</body>
</html>
